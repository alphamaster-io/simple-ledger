name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install LibreOffice Calc (formula engine for tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc
      - name: Install Python dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: python -m pyflakes src tools tests
      - name: Regenerate sample data and check it is committed unchanged
        run: |
          python tools/make_sample_data.py
          git diff --exit-code src/sample-data/
      - name: User guide is generated from the HELP sheet
        run: |
          python tools/make_user_guide.py
          git diff --exit-code docs/user-guide.md
      - name: Build workbooks
        run: python -m simpleledger.build
      - name: Test (builds and recalculates every data set)
        run: python -m pytest -q
      - name: Upload built workbooks
        uses: actions/upload-artifact@v4
        with:
          name: simpleledger-workbooks
          path: dist/
